services:
  - type: web
    name: phishing-detection-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python backend/data_pipeline.py && python backend/model_trainer.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
