services:
  - type: web
    name: phishing-detector-app
    env: python
    region: oregon
    plan: free
    buildCommand: |
      echo "Installing Python dependencies..."
      cd backend
      pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
